[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
loglevel=info

; ─────────────────────────────────────────────
; MLflow tracking server  (port 5001, internal)
; ─────────────────────────────────────────────
[program:mlflow]
command=mlflow server --backend-store-uri sqlite:////app/mlruns/mlflow.db --default-artifact-root /app/mlruns/artifacts --host 0.0.0.0 --port 5001
autostart=true
autorestart=true
startsecs=5
priority=10
stderr_logfile=/var/log/supervisor/mlflow.err.log
stdout_logfile=/var/log/supervisor/mlflow.out.log

; ─────────────────────────────────────────────
; Flask prediction API  (port 5000, internal)
; ─────────────────────────────────────────────
[program:api]
command=gunicorn --workers 2 --bind 0.0.0.0:5000 --timeout 120 --log-level info "modelguard.api:create_app()"
directory=/app
environment=MLFLOW_TRACKING_URI="http://localhost:5001",MLFLOW_ARTIFACT_ROOT="/app/mlruns/artifacts",API_HOST="0.0.0.0",API_PORT="5000",LOG_LEVEL="INFO",PYTHONPATH="/app/src"
autostart=true
autorestart=true
startsecs=20
priority=20
stderr_logfile=/var/log/supervisor/api.err.log
stdout_logfile=/var/log/supervisor/api.out.log

; ─────────────────────────────────────────────
; Streamlit dashboard  (port 8501, public-facing)
; ─────────────────────────────────────────────
[program:dashboard]
command=streamlit run /app/dashboard/app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --server.enableCORS=false --server.enableXsrfProtection=false
directory=/app
environment=MLFLOW_TRACKING_URI="http://localhost:5001",MLFLOW_ARTIFACT_ROOT="/app/mlruns/artifacts",MODEL_GUARD_API_URL="http://localhost:5000",LOG_LEVEL="INFO",PYTHONPATH="/app/src"
autostart=true
autorestart=true
startsecs=30
priority=30
stderr_logfile=/var/log/supervisor/dashboard.err.log
stdout_logfile=/var/log/supervisor/dashboard.out.log

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
loglevel=info

; ─────────────────────────────────────────────
; Streamlit dashboard only  (port 8501)
; Reads MLflow via SQLite — no API process needed.
; Prediction form will show API unavailable, all
; monitoring/model/history pages work normally.
; ─────────────────────────────────────────────
[program:dashboard]
command=streamlit run /app/dashboard/app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --server.enableCORS=false --server.enableXsrfProtection=false
directory=/app
environment=MLFLOW_TRACKING_URI="sqlite:////app/mlruns/mlflow.db",MLFLOW_ARTIFACT_ROOT="/app/mlruns/artifacts",MODEL_GUARD_API_URL="http://localhost:5000",LOG_LEVEL="INFO",PYTHONPATH="/app/src"
autostart=true
autorestart=true
startsecs=10
priority=10
stderr_logfile=/var/log/supervisor/dashboard.err.log
stdout_logfile=/var/log/supervisor/dashboard.out.log

apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelguard-api
  namespace: default
  labels:
    app: modelguard-api
    version: "1.0"
spec:
  # The SQLite backend and sample PVCs use single-writer storage.
  replicas: 1
  selector:
    matchLabels:
      app: modelguard-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: modelguard-api
    spec:
      containers:
        - name: modelguard-api
          image: modelguard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: "5000"
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                configMapKeyRef:
                  name: modelguard-config
                  key: MLFLOW_TRACKING_URI
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: mlruns-storage
              mountPath: /app/mlruns
            - name: artifacts-storage
              mountPath: /app/artifacts
      volumes:
        - name: mlruns-storage
          persistentVolumeClaim:
            claimName: mlruns-pvc
        - name: artifacts-storage
          persistentVolumeClaim:
            claimName: artifacts-pvc

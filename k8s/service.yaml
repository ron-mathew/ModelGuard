apiVersion: v1
kind: Service
metadata:
  name: modelguard-api-service
  namespace: default
  labels:
    app: modelguard-api
spec:
  selector:
    app: modelguard-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP
---
# NodePort service for local Minikube / kind access
apiVersion: v1
kind: Service
metadata:
  name: modelguard-api-nodeport
  namespace: default
spec:
  selector:
    app: modelguard-api
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30500
  type: NodePort

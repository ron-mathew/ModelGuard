apiVersion: v1
kind: ConfigMap
metadata:
  name: modelguard-config
  namespace: default
data:
  MLFLOW_TRACKING_URI: "sqlite:////app/mlruns/mlflow.db"
  MLFLOW_ARTIFACT_ROOT: "/app/mlruns/artifacts"
  API_HOST: "0.0.0.0"
  API_PORT: "5000"
  LOG_LEVEL: "INFO"
  DRIFT_THRESHOLD: "0.5"
  CHALLENGER_MIN_ROC_AUC: "0.65"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlruns-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: artifacts-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
